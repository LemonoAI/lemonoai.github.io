<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LemonoSearch</title>
<style>
:root{
  --bg:#14130e;
  --panel:#1d1b13;
  --ink:#f2eedb;
  --dim:#9a957f;
  --lem:#f7d83a;
  --line:#35321f;
  box-sizing:border-box;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font:16px/1.6 Georgia,"Iowan Old Style",serif;
  display:flex;
  flex-direction:column;
  padding-top:env(safe-area-inset-top,0);
}
.unselectable{
  user-select:none;
  -webkit-user-select:none;
  -moz-user-select:none;
  -ms-user-select:none;
}

/* Home Center Layout */
body.home-mode{
  justify-content:center;
  align-items:center;
}
body.home-mode #top-bar{
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
  max-width:680px;
  padding:0 20px;
  border-bottom:none;
  margin-bottom:8vh;
}
body.home-mode #brand{
  font-size:3rem;
  font-weight:700;
  color:var(--lem);
  letter-spacing:-0.02em;
  margin-bottom:24px;
  cursor:default;
}
body.home-mode #search-form{
  width:100%;
  max-width:640px;
}
body.home-mode #results-area{
  display:none;
}

/* Results Top Layout */
body.results-mode #top-bar{
  display:flex;
  align-items:center;
  gap:20px;
  padding:14px 24px;
  border-bottom:1px solid var(--line);
  background:var(--bg);
  position:sticky;
  top:0;
  z-index:20;
  flex-wrap:wrap;
}
body.results-mode #brand{
  font-size:1.55rem;
  font-weight:700;
  color:var(--lem);
  letter-spacing:-0.02em;
  cursor:pointer;
  flex-shrink:0;
}
body.results-mode #brand:hover{
  opacity:0.9;
}
body.results-mode #search-form{
  flex:1;
  max-width:680px;
  min-width:260px;
}

/* Search Form */
#search-form{
  display:flex;
  gap:8px;
}
#q{
  flex:1;
  height:46px;
  background:var(--panel);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:14px;
  padding:0 16px;
  font:inherit;
  font-size:1rem;
}
#q:focus,button:focus-visible{
  outline:2px solid var(--lem);
  outline-offset:1px;
}
#search-btn{
  border:0;
  border-radius:14px;
  padding:0 20px;
  height:46px;
  font:600 15px system-ui,sans-serif;
  cursor:pointer;
  background:var(--lem);
  color:#2a2400;
  flex-shrink:0;
}
#search-btn:hover{
  filter:brightness(1.05);
}

/* Main Results Area */
#results-area{
  flex:1;
  overflow-y:auto;
  padding:24px 24px 48px;
}
#results-container{
  max-width:760px;
  margin:0 auto;
}

/* Lemono AI Overview Card */
#ai-overview{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px 22px;
  margin-bottom:28px;
}
.ai-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}
.ai-logo{
  width:28px;
  height:28px;
  flex-shrink:0;
  pointer-events:none;
}
.ai-header h2{
  margin:0;
  font-size:1.35rem;
  color:var(--lem);
  line-height:1.2;
}

/* AI Content & Show More / Show Less */
#ai-body-wrapper{
  position:relative;
}
#ai-body-wrapper.collapsed{
  max-height:240px;
  overflow:hidden;
}
#ai-body-wrapper.collapsed::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:90px;
  background:linear-gradient(to bottom, rgba(29,27,19,0), var(--panel) 92%);
  pointer-events:none;
}
#ai-content p{margin:0.55em 0}
#ai-content h1,#ai-content h2,#ai-content h3{margin:0.6em 0 0.3em;line-height:1.25;color:var(--lem)}
#ai-content h1{font-size:1.4em}
#ai-content h2{font-size:1.2em}
#ai-content h3{font-size:1.05em}
#ai-content a{color:var(--lem)}
#ai-content code{background:var(--bg);padding:1px 6px;border-radius:5px;font-family:ui-monospace,Consolas,monospace;font-size:0.9em}
#ai-content pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;white-space:pre}
#ai-content pre code{background:none;padding:0}

.cite{
  position:relative;
  display:inline-block;
  min-width:1.5em;
  text-align:center;
  font:600 0.72em/1.6 system-ui,sans-serif;
  background:var(--lem);
  color:#2a2400;
  border-radius:99px;
  padding:0 6px;
  margin:0 2px;
  vertical-align:1px;
  text-decoration:none;
}
.cite .tip{
  display:none;
  position:absolute;
  left:50%;
  bottom:130%;
  transform:translateX(-50%);
  white-space:nowrap;
  background:var(--bg);
  color:var(--ink);
  border:1px solid var(--lem);
  padding:3px 9px;
  border-radius:8px;
  font-weight:400;
  z-index:10;
}
.cite:hover .tip,.cite:focus .tip{display:block}

.src{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:14px;
  font:0.8em system-ui,sans-serif;
}
.src a,.src span{
  border:1px solid var(--line);
  color:var(--dim);
  padding:3px 10px;
  border-radius:99px;
  text-decoration:none;
}
.src a:hover{
  border-color:var(--lem);
  color:var(--ink);
}

.toggle-btn{
  display:none;
  width:100%;
  margin-top:12px;
  padding:9px 16px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--lem);
  font:600 14px system-ui,sans-serif;
  cursor:pointer;
  text-align:center;
}
.toggle-btn:hover{
  border-color:var(--lem);
}
.st{
  color:var(--dim);
  font-style:italic;
  margin:0;
}

/* Search Results Section */
#results-section h3{
  font:600 0.85rem system-ui,sans-serif;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--dim);
  margin:0 0 14px;
}
.result-item{
  margin-bottom:20px;
  padding-bottom:16px;
  border-bottom:1px solid var(--line);
}
.result-item:last-child{
  border-bottom:none;
}
.result-domain{
  font:0.82rem system-ui,sans-serif;
  color:var(--dim);
  margin-bottom:2px;
}
.result-title{
  display:inline-block;
  font-size:1.12rem;
  color:var(--lem);
  text-decoration:none;
  margin-bottom:4px;
  font-weight:600;
}
.result-title:hover{
  text-decoration:underline;
}
.result-snippet{
  margin:0;
  color:var(--ink);
  font-size:0.95rem;
  line-height:1.5;
}
</style>
</head>

const $=s=>document.querySelector(s);
const brandEl=$(`#brand`), formEl=$(`#search-form`), qInput=$(`#q`);
const aiContent=$(`#ai-content`), aiWrapper=$(`#ai-body-wrapper`);
const showMoreBtn=$(`#show-more-btn`), showLessBtn=$(`#show-less-btn`);
const searchResultsEl=$(`#search-results`);

const STOP=new Set(`a an the of in on at to is are was we're be been and or for with by from as it it's this that what who when where why how did does do about tell me you your i my can could would please which`.split(` `));
const toks=t=>(t.toLowerCase().match(/[a-z0-9]+/g)||[]).map(w=>w.length>4?w.replace(/(es|s|ing|ed)$/,``):w);
const kw=t=>toks(t).filter(w=>!STOP.has(w));
const esc=s=>s.replace(/[&<>"]/g,c=>({[`&`]:`&amp;`,[`<`]:`&lt;`,[`>`]:`&gt;`,[`"`]:`&quot;`}[c]));
const pick=a=>a[(Math.random()*a.length)|0];
const dom=u=>{try{return new URL(u).hostname.replace(/^www\./,``)}catch{return u}};

/* ===== markov chain — trained once, in-memory, no caching ===== */
const MK={},FACTS=[];
for(const l of DATA){
  const i=l.indexOf(`|`),t=l.slice(0,i),x=l.slice(i+1);
  if(t===`f`){FACTS.push(x);continue}
  const lines=x.replace(/^# .*?⏎/,``).replace(/⏎/g,`\n`)
    .split(`\n`)
    .map(s=>s.replace(/\[[^\]]*\]/g,``).trim())
    .filter(Boolean);
  const m=MK[t]??={};
  for(const ln of lines){
    const q=[`^`,`^`,...ln.split(/\s+/),`$`];
    for(let j=2;j<q.length;j++)(m[q[j-2]+` `+q[j-1]]??=[]).push(q[j]);
  }
}
function nextToken(tag,a,b){
  const m=MK[tag];if(!m)return null;
  const c=m[a+` `+b];if(!c)return null;
  return pick(c);
}
function cleanWord(w){
  if(w===`$`||w===`^`||w.startsWith(`@@`))return ``;
  return w;
}
function walkMarkov(tag,maxSteps=35){
  let a=`^`,b=`^`,words=[];
  for(let n=0;n<maxSteps;n++){
    const w=nextToken(tag,a,b);
    if(w===`$`||w===null||w===undefined)break;
    const cw=cleanWord(w);
    if(cw)words.push(cw);
    a=b;b=w;
  }
  return words.join(` `).trim();
}

/* ===== song generator ===== */
function sampleLine(){
  for(let tries=0;tries<30;tries++){
    let a=`^`,b=`^`,words=[];
    for(let n=0;n<20;n++){
      const w=nextToken(`lyrics`,a,b);
      if(w===`$`||w===null)break;
      const cw=cleanWord(w);if(!cw)continue;
      words.push(cw);a=b;b=w;
      if(words.length>=5&&Math.random()<.18)break;
    }
    let s=words.join(` `).trim();
    s=s.split(`\n`).map(t=>t.replace(/^#+\s*/,``).replace(/\[[^\]]*\]/g,``).trim()).filter(Boolean).join(` `);
    if(!s)continue;
    if(/^#/.test(s)||/^\[/.test(s))continue;
    const n=s.split(/\s+/).length;
    if(n<5||n>14)continue;
    return s;
  }
  return null;
}
function makeHook(line){
  const raw=line.split(/\s+/).map(w=>w.replace(/[.,!?;:]+$/,``)).filter(Boolean);
  if(!raw.length)return null;
  const isConn=w=>/^(and|or)$/i.test(w);
  let start=Math.max(0,Math.floor(raw.length*0.35+Math.random()*raw.length*0.2));
  let out=[],i=start,extends_=0;
  while(out.length<3&&extends_<raw.length){
    const w=raw[i%raw.length];
    if(!isConn(w)&&w)out.push(w);
    i++;
    if(i>=raw.length&&out.length<3){extends_++;i=start+extends_;}
  }
  if(out.length<3)return null;
  return out.slice(0,3).join(` `).toUpperCase().replace(/[.]+$/,``);
}
function titleFromChorus(line){
  const LEAD=new Set([`I`,`you`,`we`,`they`,`it`,`it's`,`just`,`and`,`so`,`but`,`if`,`oh`,`yeah`,`a`,`an`,`the`,`my`,`your`,`our`,`their`,`don't`,`can't`,`gonna`,`still`,`all`,`of`,`on`,`in`,`to`]);
  let words=line.replace(/[.,!?;:]+/g,``).split(/\s+/).filter(Boolean);
  while(words.length&&LEAD.has(words[0].toLowerCase()))words.shift();
  const out=[];
  for(const w of words){
    if(out.length&&/^(of|in|on|at|to|for|with|by|from|the|a|an|and|or)$/i.test(w)&&out.length>=2)break;
    out.push(w);
    if(out.length>=4)break;
  }
  if(!out.length){
    const all=line.replace(/[.,!?;:]+/g,``).split(/\s+/).filter(Boolean);
    while(all.length&&LEAD.has(all[0].toLowerCase()))all.shift();
    if(!all.length)return null;
    return all.slice(-Math.min(3,all.length)).join(` `).replace(/\b\w/g,c=>c.toUpperCase());
  }
  return out.join(` `).replace(/\b\w/g,c=>c.toUpperCase());
}
function buildSong(){
  const used=new Set();
  const nextUniqueLine=(fallbackSeed)=>{
    let line=sampleLine();
    let tries=0;
    while((!line||used.has(line))&&tries<24){line=sampleLine();tries++}
    if(!line||used.has(line)){
      let n=0,f;
      do{f=(fallbackSeed||`Hold the note until the floorboards creak`)+(n?` again`:``)+`.`;n++}while(used.has(f)&&n<20);
      line=f;
    }
    used.add(line);
    return line;
  };
  const chorusLines=[];
  for(let i=0;i<4;i++){
    let line=sampleLine();
    let tries=0;
    while((!line||chorusLines.includes(line)||used.has(line))&&tries<24){line=sampleLine();tries++}
    if(!line||chorusLines.includes(line))line=`Hold the note until the floorboards creak.`;
    chorusLines.push(line);used.add(line);
  }
  let title=null;
  for(const l of chorusLines){
    const t=titleFromChorus(l);
    if(t&&t.split(/\s+/).length>=2){title=t;break}
  }
  if(!title)title=titleFromChorus(chorusLines[0])||`Untitled`;
  let hook=null;
  if(Math.random()<1/6){
    for(const cand of chorusLines){
      const h=makeHook(cand);
      if(h&&h.split(/\s+/).length===3){hook=h;break}
    }
  }
  const parts=[`# ${title}\n\n[Verse 1]`];
  for(let i=0;i<6;i++)parts.push(nextUniqueLine());
  parts.push(`\n[Chorus]`);
  if(hook)parts.push(hook);
  for(const line of chorusLines)parts.push(line);
  parts.push(`\n[Verse 2]`);
  for(let i=0;i<6;i++)parts.push(nextUniqueLine());
  parts.push(`\n[Chorus]`);
  if(hook)parts.push(hook);
  for(const line of chorusLines)parts.push(line);
  parts.push(`\n[Bridge]`);
  for(let i=0;i<3;i++)parts.push(nextUniqueLine());
  parts.push(`\n[Outro]`);
  for(let i=0;i<2;i++)parts.push(nextUniqueLine());
  return parts.join(`\n`);
}

/* ===== network ===== */
let ctl=null,searchGen=0;
const sig=ms=>{
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  ctl.signal.addEventListener(`abort`,()=>c.abort());
  c.signal.addEventListener(`abort`,()=>clearTimeout(t));
  return c.signal;
};
const jget=async u=>{
  const r=await fetch(u,{signal:sig(SYS.rules.timeoutMs)});
  if(!r.ok)throw 0;
  return r.json();
};
const jsonp=u=>new Promise((res,rej)=>{
  const n=`cb`+Math.random().toString(36).slice(2),s=document.createElement(`script`),d=()=>{delete window[n];s.remove()};
  window[n]=x=>{d();res(x)};
  s.onerror=()=>{d();rej()};
  setTimeout(()=>{d();rej()},SYS.rules.timeoutMs);
  s.src=u+`&callback=`+n;
  document.head.append(s);
});
async function ddg(q){
  const u=`https://api.duckduckgo.com/?format=json&no_html=1&skip_disambig=1&t=lemono&q=`+encodeURIComponent(q);
  let d;
  try{d=await jget(u)}catch{try{d=await jsonp(u)}catch{return{links:[],heading:``}}}
  const links=[],add=(url,text,title)=>url&&links.push({url,text:text||``,title:title||``});
  add(d.AbstractURL,d.AbstractText,d.Heading||dom(d.AbstractURL));
  (d.Results||[]).forEach(r=>add(r.FirstURL,r.Text,r.Text||dom(r.FirstURL)));
  const w=a=>(a||[]).forEach(x=>x.Topics?w(x.Topics):add(x.FirstURL,x.Text,x.Text||dom(x.FirstURL)));
  w(d.RelatedTopics);
  return{links,heading:d.Heading||``};
}
async function wikiSearch(q){
  try{
    const d=await jget(`https://en.wikipedia.org/w/api.php?action=query&list=search&srlimit=6&format=json&origin=*&srsearch=`+encodeURIComponent(q));
    return d.query.search.map(x=>({
      url:`https://en.wikipedia.org/wiki/`+encodeURIComponent(x.title.replace(/ /g,`_`)),
      text:x.snippet.replace(/<[^>]+>/g,``),
      title:x.title
    }));
  }catch{return[]}
}
async function read(l){
  const m=l.url.match(/^https?:\/\/([a-z-]+)\.wikipedia\.org\/wiki\/([^#?]+)/);
  try{
    if(m){
      const d=await jget(`https://${m[1]}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&exsectionformat=plain&exchars=3000&redirects=1&format=json&origin=*&titles=${m[2]}`);
      const p=Object.values(d.query.pages)[0];
      if(p.extract)return p.extract;
    }else{
      const r=await fetch(l.url,{signal:sig(SYS.rules.timeoutMs)});
      if(!r.ok)throw 0;
      const h=new DOMParser().parseFromString(await r.text(),`text/html`);
      const t=[...h.querySelectorAll(`p`)].map(p=>p.textContent).join(` `);
      if(t.length>200)return t.slice(0,4000);
    }
  }catch{}
  return l.text;
}

/* ===== answer engine (ephemeral in-memory only) ===== */
let lastQ=``;
function think(t){
  const l=t.toLowerCase().trim();
  if(l.split(/\s+/).length<4&&/^(hi|hello|hey|yo|hola|sup)\b/.test(l))return`greet`;
  if(/\b(thanks|thank you|thx|good bot|great job|awesome)\b/.test(l))return`thanks`;
  if(/^\W*(please )?(apologi[sz]e|say sorry)\b/.test(l))return`apology`;
  if(/\b(wrong|incorrect|not true|thats not|mistaken|mistake|bad answer|that was bad)\b/.test(l))return`fix`;
  if(/\b(new song|create song lyrics|create a song|make a song|make song lyrics|write a song|write song|another song)\b/.test(l))return`lyrics`;
  if(/\b(who are you|what are you|your name|what can you do|how do you work|who (made|built|created) you|are you (an? )?(ai|bot|real|human)|about yourself|introduce yourself|lemono)\b/.test(l))return`self`;
  if(/\b(generate|write|make|create|build|code)\b.*\b(html|code|app|page|website|script)\b/.test(l))return`code`;
  return`ask`;
}
const sents=t=>(t.replace(/\[\d+\]|[*`#]/g,` `).replace(/\s+/g,` `).match(/[^.!?]+(?:[.!?]+(?=\s|$)|$)/g)||[]).map(s=>s.trim()).filter(s=>s.length>25&&s.length<320);

async function answer(text,status){
  const it=think(text),R=SYS.rules;
  if(it===`greet`||it===`thanks`||it===`apology`){
    const tag=it===`apology`?`sorry`:it;
    const fallback=it===`greet`?`Hello there, I am Lemono!`:it===`thanks`?`You are very welcome!`:`I am sorry about that!`;
    return{md:walkMarkov(tag)||fallback,src:[],ddgLinks:[]};
  }
  if(it===`lyrics`){
    status(`Writing song lyrics…`);
    return{md:buildSong(),src:[],ddgLinks:[]};
  }
  let q=it===`fix`?lastQ:text,main=``,strict=false;
  if(!q)return{md:``,src:[],ddgLinks:[]};
  if(it===`self`){
    status(`Thinking about that…`);
    main=walkMarkov(`about`,40)||`I am Lemono, a research assistant.`;
    strict=true;
    q=main;
  }
  if(it===`code`){
    status(`Writing that for you…`);
    main=String.fromCharCode(96,96,96)+`\n<div>Hello</div>\n`+String.fromCharCode(96,96,96);
    strict=true;
  }
  const ctx=it!==`fix`&&lastQ&&/\b(they|them|he|she|more)\b/i.test(q);
  if(ctx)q+=` `+kw(lastQ).slice(0,3).join(` `);
  if(!ctx&&it!==`fix`)lastQ=text;

  let k=[...new Set(kw(q).filter(w=>!/^(they|them|he|she|more)$/.test(w)))];
  if(!k.length)k=toks(q);
  if(strict)k=k.slice(0,6);

  status(`Searching…`);
  const queries=[...new Set([q.trim(),k.join(` `)].filter(Boolean))];
  let r={links:[],heading:``};
  for(const v of queries){r=await ddg(v);if(r.links.length)break}

  const seen=new Set();
  const ddgLinks=r.links.filter(l=>!seen.has(l.url)&&seen.add(l.url)).slice(0,R.maxLinks);

  let searchLinks=[...ddgLinks];
  if(!searchLinks.length){
    for(const v of queries){
      const ws=await wikiSearch(v);
      const fresh=ws.filter(l=>!seen.has(l.url)&&seen.add(l.url));
      if(fresh.length){searchLinks=fresh.slice(0,R.maxLinks);break}
    }
  }

  status(`Reading ${searchLinks.length} page${searchLinks.length===1?``:`s`}…`);
  const texts=await Promise.all(searchLinks.map(read));
  const srcs=[{label:`Lemono training data`,url:null,s:FACTS}];
  searchLinks.forEach((l,i)=>texts[i]&&texts[i].length>60&&srcs.push({label:dom(l.url),url:l.url,s:sents(texts[i])}));

  if(srcs.length===1){
    for(const v of queries){
      const w=(await wikiSearch(v)).filter(l=>!seen.has(l.url)&&seen.add(l.url)).slice(0,R.maxLinks);
      if(!w.length)continue;
      const tx=await Promise.all(w.map(read));
      w.forEach((l,i)=>tx[i]&&tx[i].length>60&&srcs.push({label:dom(l.url),url:l.url,s:sents(tx[i])}));
      if(srcs.length>1)break;
    }
  }

  const pool=[];
  srcs.forEach((s,si)=>s.s.forEach((x,pos)=>pool.push({x,si,pos,w:new Set(toks(x))})));
  const idf={};
  k.forEach(t=>{const df=pool.filter(p=>p.w.has(t)).length;idf[t]=Math.log(1+pool.length/(1+df))});
  const minMatch=k.length>=2?2:1;
  pool.forEach(p=>{
    const matched=k.filter(t=>p.w.has(t));
    if(matched.length<minMatch){p.sc=0;return}
    p.sc=matched.reduce((a,t)=>a+idf[t],0)/Math.pow(p.x.length,.2);
    if(p.sc>0&&p.si&&p.pos<2)p.sc+=.4;
    if(p.si&&p.pos<3)p.sc+=.05;
  });

  const cnt={},used2=new Set(),chosen=[];
  for(const p of pool.filter(p=>p.sc>0).sort((a,b)=>b.sc-a.sc)){
    if(chosen.length>=R.maxSentences||(cnt[p.si]||0)>=R.perSource||used2.has(p.x))continue;
    if(!used2.has(`s`+p.si)&&new Set(chosen.map(c=>c.si)).size>=R.maxSources)continue;
    used2.add(p.x);cnt[p.si]=(cnt[p.si]||0)+1;chosen.push(p);
  }

  if(!chosen.length){
    const miss=walkMarkov(`nofind`)||`Sorry, I could not find anything about that, so please narrow your search down to something else.`;
    return{md:strict?(main?`${main}\n\n${miss}`:miss):miss,src:[],ddgLinks};
  }

  chosen.sort((a,b)=>a.si-b.si||a.pos-b.pos);
  const order=[],src=[];
  chosen.forEach(c=>{if(!order.includes(c.si)){order.push(c.si);src.push(srcs[c.si])}});
  const body=chosen.map(c=>c.x+(R.cite?` [${order.indexOf(c.si)+1}]`:``)).join(` `);
  const head=(r.heading||q.trim()).replace(/\b\w/g,c=>c.toUpperCase());
  const lead=(it===`fix`&&R.apologize?(walkMarkov(`sorry`)||``)+` `:``)+(walkMarkov(`intro`)||``);
  const md=strict?`${main}\n\n${lead}\n\n${body}`:`${lead}\n\n## ${head}\n\n${body}\n\n${walkMarkov(`close`)||``}`;
  return{md,src,ddgLinks};
}

/* ===== markdown + citation bubbles ===== */
function render(s,src){
  const fence=String.fromCharCode(96,96,96);
  return s.split(fence).map((x,i)=>i%2?`<pre><code>`+esc(x.replace(/^\n/,``))+`</code></pre>`:(x.trim()?rmd(x,src):``)).join(``);
}
function rmd(s,src){
  const cite=(m,n)=>{
    const x=src[n-1];if(!x)return m;
    const t=`<span class="tip">${esc(x.label)}</span>`;
    return x.url?`<a class="cite" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${n}${t}</a>`:`<span class="cite" tabindex="0">${n}${t}</span>`;
  };
  return esc(s).split(/\n{2,}/).map(b=>{
    b=b.replace(/`([^`\n]+)`/g,`<code>$1</code>`)
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,`<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>`)
      .replace(/\[(\d+)\]/g,cite)
      .replace(/\*\*(.+?)\*\*/g,`<b>$1</b>`)
      .replace(/\*(.+?)\*/g,`<i>$1</i>`);
    const h=b.match(/^(#{1,3}) (.+)$/m);
    if(h&&!b.includes(`\n`))return`<h${h[1].length}>${h[2]}</h${h[1].length}>`;
    return`<p>`+b.replace(/\n/g,`<br>`)+`</p>`;
  }).join(``);
}

/* ===== Show more / Show less (>1000 chars) ===== */
let isLongResponse=false;
function updateCollapseState(expanded){
  if(!isLongResponse){
    aiWrapper.classList.remove(`collapsed`);
    showMoreBtn.style.display=`none`;
    showLessBtn.style.display=`none`;
    return;
  }
  if(expanded){
    aiWrapper.classList.remove(`collapsed`);
    showMoreBtn.style.display=`none`;
    showLessBtn.style.display=`block`;
  }else{
    aiWrapper.classList.add(`collapsed`);
    showMoreBtn.style.display=`block`;
    showLessBtn.style.display=`none`;
  }
}
showMoreBtn.addEventListener(`click`,()=>updateCollapseState(true));
showLessBtn.addEventListener(`click`,()=>{
  updateCollapseState(false);
  $(`#ai-overview`).scrollIntoView({behavior:`smooth`,block:`start`});
});

/* ===== Results Renderer ===== */
function renderResults(links){
  searchResultsEl.innerHTML=``;
  if(!links||!links.length){
    searchResultsEl.innerHTML=`<p class="st">No results returned for this query.</p>`;
    return;
  }
  links.forEach(item=>{
    const row=document.createElement(`div`);
    row.className=`result-item`;
    const domain=dom(item.url);
    const titleText=item.title||domain;
    row.innerHTML=`
      <div class="result-domain">${esc(domain)}</div>
      <a class="result-title" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">${esc(titleText)}</a>
      ${item.text?`<p class="result-snippet">${esc(item.text)}</p>`:``}
    `;
    searchResultsEl.append(row);
  });
}

/* ===== Navigation & Search Flow ===== */
function goHome(){
  searchGen++;
  if(ctl)ctl.abort();
  document.body.classList.remove(`results-mode`);
  document.body.classList.add(`home-mode`);
  qInput.value=``;
  aiContent.innerHTML=``;
  searchResultsEl.innerHTML=``;
  isLongResponse=false;
  updateCollapseState(false);
  qInput.focus();
}

brandEl.addEventListener(`click`,()=>{
  if(document.body.classList.contains(`results-mode`))goHome();
});
brandEl.addEventListener(`keydown`,e=>{
  if((e.key===`Enter`||e.key===` `)&&document.body.classList.contains(`results-mode`)){
    e.preventDefault();
    goHome();
  }
});

async function runSearch(queryText){
  const gen=++searchGen;
  if(ctl)ctl.abort();
  ctl=new AbortController();

  document.body.classList.remove(`home-mode`);
  document.body.classList.add(`results-mode`);

  isLongResponse=false;
  updateCollapseState(false);
  aiContent.innerHTML=`<p class="st">Thinking…</p>`;
  searchResultsEl.innerHTML=`<p class="st">Loading results…</p>`;

  const status=s=>{
    if(gen!==searchGen)return;
    aiContent.innerHTML=`<p class="st">${esc(s)}</p>`;
  };

  try{
    const res=await answer(queryText,status);
    if(gen!==searchGen)return;

    const fullText=res.md||``;
    aiContent.innerHTML=render(fullText,res.src);

    if(res.src&&res.src.length){
      const d=document.createElement(`div`);
      d.className=`src`;
      res.src.forEach((s,i)=>{
        const e=document.createElement(s.url?`a`:`span`);
        if(s.url){e.href=s.url;e.target=`_blank`;e.rel=`noopener noreferrer`}
        e.textContent=`${i+1}  ${s.label}`;
        d.append(e);
      });
      aiContent.append(d);
    }

    isLongResponse=fullText.length>1000;
    updateCollapseState(false);
    renderResults(res.ddgLinks);
  }catch{
    if(gen!==searchGen)return;
    isLongResponse=false;
    updateCollapseState(false);
    aiContent.innerHTML=`<p>Sorry about that, something went wrong while searching.</p>`;
    searchResultsEl.innerHTML=``;
  }
}

formEl.addEventListener(`submit`,e=>{
  e.preventDefault();
  const t=qInput.value.trim();
  if(!t)return;
  runSearch(t);
});

qInput.focus();
})();
